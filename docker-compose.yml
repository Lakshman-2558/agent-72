services:
  agent72-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - DATABASE_URL=postgresql+psycopg://agent72_user:agent72_secret@postgres:5432/agent72_db
      - LOG_LEVEL=INFO
      - AI_PROVIDER_TYPE=mock
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: agent72_user
      POSTGRES_PASSWORD: agent72_secret
      POSTGRES_DB: agent72_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent72_user -d agent72_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
